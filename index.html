<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1C2026" />
    <meta name="description" content="Orça Obra: calcule quanto cobrar em obras elétricas comerciais." />
    <link rel="icon" type="image/png" href="icon-192.png" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <script>
      // Define o tema antes do primeiro desenho, para não piscar branco no modo escuro.
      try {
        var t = localStorage.getItem("orca-obra-tema");
        if (t === "escuro" || (t !== "claro" && matchMedia("(prefers-color-scheme: dark)").matches)) document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
    <title>Orça Obra</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
